---
# Source: todoapp/templates/deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-deployment
  namespace: todoapp

spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: todoapp

  template:
    metadata:
      labels:
        app: todoapp

    spec:
      serviceAccountName: todoapp-sa

      containers:
        - name: todoapp
          image: "ikulyk404/todoapp:3.0.0"

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: data
              mountPath: /app/data

            - name: app-secrets-volume
              mountPath: /app/secrets
              readOnly: true

            - name: app-config-volume
              mountPath: /app/configs
              readOnly: true

          resources:
            limits:
              cpu: 150m
              memory: 256Mi
            requests:
              cpu: 150m
              memory: 256Mi

          env:
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: todoapp-configmap
                  key: DB_PORT
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: todoapp-configmap
                  key: DJANGO_DEBUG
            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: todoapp-configmap
                  key: PYTHONUNBUFFERED
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: DB_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: DB_USER
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: SECRET_KEY

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: todoapp-pvc

        - name: app-secrets-volume
          secret:
            secretName: todoapp-secret

        - name: app-config-volume
          configMap:
            name: todoapp-configmap

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - "todoapp"

---
# Source: todoapp/templates/hpa.yml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todoapp-hpa
  namespace: todoapp
  labels:
    app: todoapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todoapp-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
# Source: todoapp/charts/mysql/templates/statefulSet.yml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-statefulset
  namespace: mysql
  labels:
    app: mysql

spec:
  replicas: 1
  serviceName: mysql-headless

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/name: mysql

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - mysql
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mysql
              topologyKey: kubernetes.io/hostname
            weight: 100

      tolerations:
        - effect: NoSchedule
          key: app
          operator: Equal
          value: mysql

      containers:
        - name: mysql
          image: "mysql:8.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

          ports:
            - name: mysql
              containerPort: 3306

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
              subPath: mysql

            - name: config-map
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true


          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi

          startupProbe:
            exec:
              command: ["mysqladmin", "ping"]
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command: ["mysqladmin", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command: ["mysqladmin", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5

      volumes:
        - name: config-map
          configMap:
            name: mysql-configmap

  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
