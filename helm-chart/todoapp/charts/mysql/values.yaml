mysql:
  namespace: mysql
  statefulset:
    replicas: 2
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                - mysql
          topologyKey: "kubernetes.io/hostname"
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "app"
                operator: In
                values:
                - "mysql"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  image:
    name: mysql
    tag: 8.0
  secrets:
    MYSQL_ROOT_PASSWORD: "MTIzNA=="
    MYSQL_USER: "YXBwX3VzZXI="
    MYSQL_PASSWORD: "MTIzNA=="
    MYSQL_DATABASE: "YXBwX2RiCg=="
  tolerations:
    key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"


pvc:
  resources:
    requests:
      storage: 2Gi

