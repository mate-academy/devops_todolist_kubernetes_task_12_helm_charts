common:
  namespace: "mysql"

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

statefulSet:
  replicas: 2

image:
  repository: "mysql"
  tag: "8.0"

volumeClaimTemplates:
  spec:
    resources:
      requests:
        storage: 2Gi

tolerations:
  key: "app"
  operator: "Equal"
  value: "mysql"
  effect: "NoSchedule"

affinity:
  podAntiAffinity:
    matchExpressions:
      key: "app"
      operator: "In"
      values:
        - mysql
      topologyKey: "kubernetes.io/hostname"
  nodeAffinity:
    matchExpressions:
      key: "app"
      operator: "In"
      values:
        - "mysql"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"