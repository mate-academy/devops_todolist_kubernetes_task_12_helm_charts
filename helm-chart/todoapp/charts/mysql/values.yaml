mysql:
  metadata:
    namespace: mysql

  secrets:
    MYSQL_ROOT_PASSWORD: "1234" # Base64 encoding for "1234"
    MYSQL_USER: "app_user" # Base64 encoding for "app_user"
    MYSQL_PASSWORD: "1234" # Base64 encoding for "1234"

  replicasset:
    replicas: 2

  image:
    repository: mysql
    version: "8.0"

  pvcresources:
    requests:
      storage: 2Gi

  tolerations:
    key: app
    operator: Equal
    value: mysql
    effect: NoSchedule

  affinityPod:
    podAntiAffinity:
      key: app
      values:
        - mysql

  affinityNode:
    nodeAffinity:
      key: app
      values:
      - mysql

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "500Mi"
      cpu: "1Gi"