common:
  namespace: mysql

image:
  repository: mysql
  version: 8.0

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

stSet:
  replicas: 2
  storage: 2Gi
  tolerations:
    key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"
  podAntiAffinity:
    key: "app"
    operator: In
    values:
    - mysql
  nodeAffinity:
    key: "app"
    operator: In
    values:
    - mysql
  resources:
    memoryRequest: "1Gi"
    cpuRequest: "500m"