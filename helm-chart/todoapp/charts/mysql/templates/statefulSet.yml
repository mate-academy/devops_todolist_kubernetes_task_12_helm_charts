apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Chart.Name}}
  namespace: {{.Values.common.namespace}}
spec:
  selector:
    matchLabels:
      app: {{.Chart.Name}}
  replicas: {{.Values.statefulSet.replicas}}
  serviceName: {{.Chart.Name}}
  template:
    metadata:
      labels:
        app: {{.Chart.Name}}
    spec:
      containers:
      - name: {{.Chart.Name}}
        image: {{.Values.image.repository}}:{{.Values.image.tag}}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: app_db
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql
        - name: config-map
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: {{.Values.resources.requests.cpu}}
            memory: {{.Values.resources.requests.memory}}
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
      volumes:
      - name: config-map
        configMap:
          name: {{ .Chart.Name }}
      tolerations:
      - key: {{.Values.tolerations.key}}
        operator: {{.Values.tolerations.operator}}
        value: {{.Values.tolerations.value}}
        effect: {{.Values.tolerations.effect}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: {{.Values.affinity.podAntiAffinity.matchExpressions.key}}
                    operator: {{.Values.affinity.podAntiAffinity.matchExpressions.operator}}
                    values:
                    - {{.Values.affinity.podAntiAffinity.matchExpressions.values }}
              topologyKey: {{.Values.affinity.podAntiAffinity.topologyKey}}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{.Values.affinity.nodeAffinity.matchExpressions.key}}
                    operator: {{.Values.affinity.nodeAffinity.matchExpressions.operator}}
                    values:
                    - {{.Values.affinity.nodeAffinity.matchExpressions.values }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{.Values.volumeClaimTemplates.spec.resources.requests.storage}}
