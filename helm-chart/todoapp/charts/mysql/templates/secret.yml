# helm-chart/todoapp/charts/mysql/templates/secret.yml
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: {{ .Values.mysql.namespace }}
type: Opaque
data:
  # Ітеруємо по ключах та значеннях з .Values.mysql.secrets
  # КОЖНЕ ЗНАЧЕННЯ ПОВИННО БУТИ ЗАКОДОВАНЕ В BASE64
  {{- range $k, $v := .Values.mysql.secrets }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
