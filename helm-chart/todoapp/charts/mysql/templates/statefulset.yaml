apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mysql.fullname" (dict "Chart" .Chart "name" "statefulset") }}
  namespace: {{ .Values.namespace }}
spec:
  serviceName: {{ include "mysql.fullname" (dict "Chart" .Chart "name" "service") }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.affinity.key }}
                    operator: In
                    values:
{{- toYaml .Values.affinity.values | nindent 22 }}
      tolerations:
{{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
{{- range $key, $_ := .Values.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.fullname" (dict "Chart" $.Chart "name" "secret") }}
                  key: {{ $key }}
{{- end }}
          resources:
{{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ include "mysql.fullname" (dict "Chart" .Chart "name" "pvc") }}