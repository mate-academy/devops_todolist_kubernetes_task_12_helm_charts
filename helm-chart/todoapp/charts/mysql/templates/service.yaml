apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql.fullname" (dict "Chart" .Chart "name" "service") }}
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql