apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql.fullname" . }}-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  ports:
    - port: 3306
      name: mysql
  selector:
    {{- include "mysql.selectorLabels" . | nindent 4 }}
  clusterIP: None # headless service for StatefulSet