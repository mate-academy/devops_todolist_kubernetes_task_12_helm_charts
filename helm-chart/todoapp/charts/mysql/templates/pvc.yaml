apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mysql.fullname" (dict "Chart" .Chart "name" "pvc") }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
{{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.storage }}