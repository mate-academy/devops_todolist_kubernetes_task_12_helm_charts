namespace: mysql

replicas: 2

image:
  repository: mysql
  tag: "8.0"

database:
  name: app_db

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"

pvc:
  requests:
    storage: 2Gi

affinity:
  key: app
  values:
    - mysql

toleration:
  key: app
  value: mysql

secrets:
  data:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"