apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "todoapp.fullname" . }}-read-pods
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "todoapp.fullname" . }}-pod-reader
subjects:
- kind: ServiceAccount
  name: {{ include "todoapp.fullname" . }}-{{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}