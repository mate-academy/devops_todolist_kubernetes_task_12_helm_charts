apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.common.namespace }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.todoapp.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.todoapp.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Values.todoapp.serviceAccountName }}
      containers:
        - name: {{ .Values.todoapp.image.name }}
          image: {{ .Values.todoapp.image.repository }}:{{ .Values.todoapp.image.version }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: secrets
              mountPath: /app/secrets
              readOnly: true
            - name: config
              mountPath: /app/configs
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.todoapp.resources.requests.cpu }}
              memory: {{ .Values.todoapp.resources.requests.memory }}
            limits:
              cpu: {{ .Values.todoapp.resources.limits.cpu }}
              memory: {{ .Values.todoapp.resources.limits.memory }}
          env:
            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: PYTHONUNBUFFERED
            {{- if .Values.todoapp.secrets }}
            {{- range $k, $_ := .Values.todoapp.secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Chart.Name }}-secret
                  key: {{ $k }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-pvc
        - name: secrets
          secret:
            secretName: {{ .Chart.Name }}-secret
        - name: config
          configMap:
            name: {{ .Chart.Name }}-config
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: {{ .Values.todoapp.affinity.key }}
                    operator: In
                    values:
                      {{- range .Values.todoapp.affinity.values }}
                      - {{ . }}
                      {{- end }}
