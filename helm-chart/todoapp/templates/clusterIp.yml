{{- if eq (default "ClusterIP" .Values.todoapp.service.type) "ClusterIP" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-service
  namespace: {{ .Values.common.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.todoapp.service.port }}
      targetPort: {{ default .Values.todoapp.ports.container .Values.todoapp.service.targetPort }}
{{- end }}
