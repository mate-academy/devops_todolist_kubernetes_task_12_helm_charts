{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "todoapp.fullname" (dict "Chart" .Chart "name" "role") }}
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "todoapp.fullname" (dict "Chart" .Chart "name" "rolebinding") }}
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "todoapp.fullname" (dict "Chart" .Chart "name" "role") }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}