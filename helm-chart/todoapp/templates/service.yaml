apiVersion: v1
kind: Service
metadata:
  name: {{ include "todoapp.fullname" (dict "Chart" .Chart "name" "service") }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http