apiVersion: v1
kind: Service
metadata:
  name: {{ include "todoapp.fullname" . }}-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "todoapp.selectorLabels" . | nindent 4 }}