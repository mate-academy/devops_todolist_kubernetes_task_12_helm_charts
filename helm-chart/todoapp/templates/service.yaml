apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-clusterip
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
    - port: {{ .Values.service.clusterIp.port }}
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-nodeport
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: {{ .Chart.Name }}
  ports:
    - port: {{ .Values.service.nodePort.port }}
      targetPort: 8080
      nodePort: {{ .Values.service.nodePort.nodePort }}