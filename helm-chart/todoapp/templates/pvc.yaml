{{- if .Values.persistence.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "todoapp.fullname" (dict "Chart" .Chart "name" "pvc") }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
{{- toYaml .Values.persistence.pvc.accessModes | nindent 4 }}
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.persistence.pvc.storage }}
{{- end }}