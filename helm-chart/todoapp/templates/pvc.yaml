apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "todoapp.fullname" . }}-pvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.requests.storage }}