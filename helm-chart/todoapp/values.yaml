common:
  namespace: todoapp

todoapp:
  image:
    name: todoapp
    repository: ikulyk404/todoapp
    version: 4.0.1

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

  serviceAccountName: secrets-reader

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

  nodeAffinity:
    key: app
    value: kube2py

  replicas:
    minReplicas: 2
    maxReplicas: 5

  hpa:
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 70


  pv:
    storage: 1Gi

  pvc:
    requests:
      storage: 1Gi
