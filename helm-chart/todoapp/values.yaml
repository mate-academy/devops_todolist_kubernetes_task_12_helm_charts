namespace: todoapp

serviceAccount:
  name: secrets-reader

image:
  repository: tanyasavenko/todoapp
  tag: "4.0.1"

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

affinity:
  key: app
  values:
    - kube2py

secrets:
  data:
    SECRET_KEY: "QGUyKHl4KXYmdGdoM19zPTB5amEtaFFkcGViaHM="
    DB_NAME: "YXBwX2RiCg=="
    DB_USER: "YXBwX3VzZXI="
    DB_PASSWORD: "MTIzNA=="
    DB_HOST: "bXlzcWwtMC5teXNxbC5teXNxbC5zdmMuY2x1c3Rlci..."

configMap:
  data:
    PYTHONUNBUFFERED: "1"

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

pv:
  capacity: 1Gi

pvc:
  requests:
    storage: 1Gi

service:
  clusterIp:
    port: 8080
  nodePort:
    port: 8080
    nodePort: 30080

