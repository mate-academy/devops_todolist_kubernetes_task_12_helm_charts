namespace: todoapp

image:
  repository: todoapp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  name: todoapp-sa

# Demo values only. Never commit real secrets.
secrets:
  SECRET_KEY: change-me-to-a-long-random-string
  DB_HOST: mysql-service
  DB_NAME: todolist
  DB_USER: todo
  DB_PASSWORD: todopass

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

nodeAffinity:
  key: app
  values:
    - todoapp

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 80

pv:
  capacity: 1Gi
  hostPath: /mnt/data/todoapp

pvc:
  storage: 1Gi

service:
  port: 80
  targetPort: 8000

# overrides for the mysql subchart
mysql:
  namespace: todoapp
