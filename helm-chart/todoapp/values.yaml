common:
  namespace: todoapp

image:
  repository: ikulyk404/todoapp
  version: 4.0.1

secrets:
  SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "1234"
  DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

resources:
  memoryRequest: "256Mi"
  cpuRequest: "150m"
  memoryLimit: "256Mi"
  cpuLimit: "150m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

nodeAffinity:
  weight: 1
  key: app
  operator: In
  values:
  - todoapp

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuAverageUtilization: 70
  memoryAverageUtilization: 70

pv:
  storage: 1Gi

pvc:
  storage: 1Gi