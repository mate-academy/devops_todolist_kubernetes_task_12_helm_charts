common:
  namespace: todoapp

todoapp:
  image:
    name: todoapp
    repository: ikulyk404/todoapp
    version: 4.0.1

  configs:
    secretEnvs:
      - name: SECRET_KEY
        key: SECRET_KEY
      - name: DB_NAME
        key: DB_NAME
      - name: DB_USER
        key: DB_USER
      - name: DB_PASSWORD
        key: DB_PASSWORD
      - name: DB_HOST
        key: DB_HOST

  secrets:
  SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
  DB_NAME: "YXBwX2RiCg=="
  DB_USER: "YXBwX3VzZXI="
  DB_PASSWORD: "MTIzNA=="
  DB_HOST: "bXlzcWwtMC5teXNxbC5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbAo="

  resources:
    requests:
      memory: 256Mi
      cpu: 150m
    limits:
      memory: 256Mi
      cpu: 150m

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

  affinity:
    key: app
    values:
    - todoapp

  hpa:
    minReplicas: 2
    maxReplicas: 5
    resource:
      memory:
        averageUtilization: 70
      cpu:
        averageUtilization: 70

  pv:
    storageCapacity: 1Gi

  pvc:
    resource:
      storage: 1Gi

  rbac:
    name: secrets-reader