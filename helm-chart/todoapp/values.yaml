# Namespace name
namespace: todoapp-prod

# Secrets for Django ToDo App
# Data will be populated by a range function in the Deployment
# Key-value pairs here will be mapped to environment variables
todoappSecrets:
  DJANGO_SECRET_KEY: "your_django_secret_key_here" # CHANGE THIS IN PRODUCTION!
  DB_NAME: "todolist"
  DB_USER: "root"
  DB_PASSWORD: "your_mysql_password_here" # This should match the MySQL root password
  DB_HOST: "mysql-service.mysql-prod.svc.cluster.local" # default MySQL service name in its namespace

# Resource requests and limits for the todoapp container
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# RollingUpdate parameters
rollingUpdate:
  maxUnavailable: 25%
  maxSurge: 1

# Image repository and tag
image:
  repository: leoleiden/django-todo-app # Replace with your Docker Hub image if different
  tag: latest
  pullPolicy: IfNotPresent

# Deployment node affinity parameters
nodeAffinity:
  enabled: false # Set to true to enable node affinity for todoapp
  key: "kubernetes.io/hostname"
  value: "kind-worker2" # Example: Deploy only on kind-worker2

# Horizontal Pod Autoscaler (HPA)
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 70

# Persistent Volume (PV) for Django's static files/media (if needed, otherwise remove)
pv:
  capacity: 5Gi

# Persistent Volume Claim (PVC)
pvc:
  requests:
    storage: 1Gi

# Service Account Name for Deployment and RBAC
serviceAccountName: todoapp-sa

mysql:
  # MySQL sub-chart values can be overridden here
  namespace: mysql-prod # Must match DB_HOST in todoappSecrets if in same cluster
  secrets:
    MYSQL_ROOT_PASSWORD: "your_mysql_password_here" # IMPORTANT: This must be the same as DB_PASSWORD in todoappSecrets
    MYSQL_DATABASE: "todolist"
  replicas: 1 # For production, consider increasing
  image:
    repository: mysql
    tag: 8.0 # Recommended version for Django 4+
  pvc:
    requests:
      storage: 5Gi
  affinity: {} # No specific affinity for MySQL by default, but can be added here
  tolerations:
    - key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
