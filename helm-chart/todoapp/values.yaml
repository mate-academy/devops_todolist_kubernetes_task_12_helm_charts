todoapp:
  namespace: todoapp
  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  image:
    name: todoapp
    repository: ikulyk404/todoapp
    tag: 4.0.1
  affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: app
                operator: In
                values:
                - kube2py
  hpa:
    kind: HorizontalPodAutoscaler
    metadata:
      name: todoapp
      namespace: todoapp
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
      minReplicas: 2
      maxReplicas: 5
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 70
  pv:
    metadata:
      namespace: todoapp
    spec:
      storageClassName: standard
      persistentVolumeReclaimPolicy: Delete
      accessModes:
        - ReadWriteMany
      capacity:
        storage: 1Gi
      hostPath:
        path: /data/
  pvc:
    resources:
      requests:
        storage: 1Gi
  secrets:
    data:
      SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
      DB_NAME: "YXBwX2RiCg=="
      DB_USER: "YXBwX3VzZXI="
      DB_PASSWORD: "MTIzNA=="
      DB_HOST: "bXlzcWwtMC5teXNxbC5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbAo="

