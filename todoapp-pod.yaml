apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp-todoapp
  labels:
    app: todoapp-standalone
spec:
  containers:
    - name: todoapp
      image: ikulyk404/todoapp:4.0.1
      ports:
        - containerPort: 8080
      envFrom:
        - secretRef:
            name: todoapp-app-secret
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
      resources:
        requests:
          memory: "256Mi"
          cpu: "150m"
        limits:
          memory: "256Mi"
          cpu: "150m"
      livenessProbe:
        httpGet:
          path: /api/health
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /api/ready
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
