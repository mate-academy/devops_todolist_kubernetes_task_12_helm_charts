common:
  namespace: todoapp

todoapp:
  image:
    name: app
    repository: ikulyk404/todoapp
    version: 4.0.1

  configs:
    PYTHONUNBUFFERED: "1"

  deployment:
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 1
    template:
      spec:
        serviceAccountName: secrets-reader
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kube2py

  hpa:
    minReplicas: 2
    maxReplicas: 5
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 70

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

  pv:
    capscity:
      storage: 1Gi

  pvc:
    resources:
      requests:
        storage: 1Gi
