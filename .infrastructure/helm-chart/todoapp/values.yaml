common:
  namespace: todoapp


todoapp:
  secrets:
    SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
    database:
      DB_NAME: "app_db"
      DB_USER: "app_user"
      DB_PASSWORD: "1234"
      DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

  containers:
    image:
      repository: ikulyk404/todoapp
      tag: 4.0.1

  nodeAffinity:
    weight: 1
    key: app
    operator: In
    values: kube2py

  hpa:
    minReplicas: 2
    maxReplicas: 5
    metrics:
      cpu: 70
      memory: 70

  pv:
    capacity: 1Gi

  pvc:
    requests:
      storage: 1Gi

  rbac:
    serviceAccountName: secrets-reader
