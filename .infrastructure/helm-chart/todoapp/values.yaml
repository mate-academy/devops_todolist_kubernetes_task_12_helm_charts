todoapp:
  namespace: todoapp

  secrets:
    SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
    DB_NAME: app_db
    DB_USER: app_user
    DB_PASSWORD: "1234"
    DB_HOST: mysql-0.mysql.mysql.svc.cluster.local

  hpa:
    averageUtilization: 70
    minReplicas: 2
    maxReplicas: 5

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"


  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  image:
    name: ikulyk404/todoapp
    tag: 4.0.1


  affinity:
    weight: 1
    key: app
    values:
      - kube2py


  capacity:
    storage: 1Gi

  requests:
    storage: 1Gi

  serviceAccountName: secrets-reader


mysql:
  namespace: mysql
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: app_user
    MYSQL_PASSWORD: "1234"

  replicas: 2

  image:
    name: mysql
    tag: 8.0

  storage: 2Gi

  tolerations:
    key: "app"
    value: "mysql"
    effect: "NoSchedule"

  affinity:
    key: "app"
    value: "mysql"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi