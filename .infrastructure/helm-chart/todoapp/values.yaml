todoapp:
  image:
    name: todoapp
    image: ikulyk404/todoapp
    version: 4.0.1

  common:
    namespace: todoapp

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  secrets:
    data:
      SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
      DB_NAME: "YXBwX2RiCg=="
      DB_USER: "YXBwX3VzZXI="
      DB_PASSWORD: "MTIzNA=="
      DB_HOST: "bXlzcWwtMC5teXNxbC5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbAo="

  config:
    data:
      PYTHONUNBUFFERED: "1"

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - kube2py

  hpa:
    minReplicas: 2
    maxReplicas: 5
    averageCpuUtilization: 70
    averageMemoryUtilization: 70

  pv:
    capacity:
      storage: 2Gi

  pvc:
    resources:
      requests:
        storage: 1Gi

  serviceAccount:
    name: secrets-reader
