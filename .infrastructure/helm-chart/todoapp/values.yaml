common:
  namespace: todoapp

todoapp:
  image:
    name: todoapp
    repository: ikulyk404/todoapp
    version: 4.0.1

  configs:
    secretEnvs:
      - name: SECRET_KEY
        key: SECRET_KEY
      - name: DB_NAME
        key: DB_NAME
      - name: DB_USER
        key: DB_USER
      - name: DB_PASSWORD
        key: DB_PASSWORD
      - name: DB_HOST
        key: DB_HOST

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

  resources:
    requests:
      memory: 256Mi
      cpu: 150m
    limits:
      memory: 256Mi
      cpu: 150m

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

  affinity:
    key: app
    values:
    - todoapp

  hpa:
    minReplicas: 2
    maxReplicas: 5
    resource:
      memory:
        averageUtilization: 70
      cpu:
        averageUtilization: 70

  pv:
    storageCapacity: 1Gi

  pvc:
    resource:
      storage: 1Gi

  rbac:
    name: secrets-reader