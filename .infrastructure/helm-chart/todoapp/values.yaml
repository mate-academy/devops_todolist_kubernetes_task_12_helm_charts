# helm-chart/todoapp/values.yaml
namespace: todoapp

todoapp:

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1
  
  image:
    name: todoapp
    repository: ikulyk404/todoapp
    tag: "4.0.1"

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: app_db
    DB_USER: app_user
    DB_PASSWORD: "1234"
    DB_HOST: mysql-0.mysql.mysql-mysql.svc.cluster.local
  
  configs:
    PYTHONUNBUFFERED: "1"
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"
  
  affinity:
    weight: 1
    key: app
    values:
      - todoapp
  
  hpa:
    minReplicas: 2
    maxReplicas: 5
    averageCpuUtilization: 70
    averageMemoryUtilization: 70

  pv:
    capacity:
      storage: 1Gi
  
  pvc:
    requests:
      storage: 1Gi
  
  serviceAccount:
    name: secrets-reader