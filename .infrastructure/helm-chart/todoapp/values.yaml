namespace: todoapp

secrets:
  SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "1234"
  DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

mysql:  
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

image:
  repo: "ikulyk404/todoapp"
  ver: "4.0.1"

nodeAffinity:
  weight: 1
  key: app
  values:
    - kube2py
  operator: In

hpa:
  minReplicas: 2
  maxReplicas: 5
  memory_utilization: 70
  cpu_utilization: 70

volumes:
  pv:
    capacity_storage: "1Gi"
  pvc:
    requests_storage: "1Gi"

ServiceAccount:
  name: secrets-reader
