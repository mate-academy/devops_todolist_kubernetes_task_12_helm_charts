namespace: todoapp

secretData:
  SECRET_KEY: "c3VwZXItc2VjcmV0LWtleQ=="
  DB_NAME: "YXBwX2Ri"
  DB_USER: "YXBwX3VzZXI="
  DB_PASSWORD: "MTIzNA=="
  DB_HOST: "bXlzcWwtMC5teXNxbC5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbA=="

serviceAccount:
  nameSuffix: secrets-reader

image:
  repository: ikulyk404/todoapp
  tag: "4.0.1"
  pullPolicy: IfNotPresent

deployment:
  replicas: 2
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1
  nodeAffinity:
    key: app
    values:
      - todoapp

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

hpa:
  minReplicas: 2
  maxReplicas: 5
  averageCPUUtilization: 70
  averageMemoryUtilization: 70

persistence:
  pv:
    storageClassName: standard
    capacity: 1Gi
    hostPath: /data/todoapp
    accessModes:
      - ReadWriteMany
  pvc:
    accessModes:
      - ReadWriteMany
    requestsStorage: 1Gi

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30007

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: ""
  path: /
  pathType: Prefix

rbac:
  create: true

mysql:
  namespace: mysql
  secretData:
    MYSQL_ROOT_PASSWORD: "MTIzNA=="
    MYSQL_USER: "YXBwX3VzZXI="
    MYSQL_PASSWORD: "MTIzNA=="
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  statefulset:
    replicas: 2
  service:
    port: 3306
  database:
    name: app_db
  storage:
    accessModes:
      - ReadWriteOnce
    requestsStorage: 2Gi
  tolerations:
    - key: app
      operator: Equal
      value: mysql
      effect: NoSchedule
  affinity:
    node:
      key: app
      values:
        - mysql
    podAntiAffinity:
      enabled: true
      topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 1Gi
  configMap:
    initSql: |
      GRANT ALL PRIVILEGES ON app_db.* TO 'app_user'@'%';
      USE app_db;
      CREATE TABLE counter (
          id INT AUTO_INCREMENT PRIMARY KEY,
          value INT
      );
