todoapp:
  namespace: todoapp
  deployment:
    resourceLimits:
      cpu: 150m
      memory: 256Mi
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
    image:
      repository: ikulyk404/todoapp
      tag: 4.0.1
    nodeAffinity:
      weight: 1
      key: app
      operator: In
      values:
        - todoapp
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  pv:
    storage: 1Gi
  pvc:
    storage: 1Gi
  serviceAccount:
    name:  secrets-reader

