common:
  namespace: todoapp

todoapp:
  image:
    name: todoapp
    repository: ikulyk404/todoapp
    version: 4.0.1
  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"
  updateStrategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yj-a!dpebysz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"
  affinity:
    nodeAffinity:
      weight: 1
      matchExpressions:
        key: app
        matchValues: kube2py

hpa:
  spec:
    minReplicas: 2
    maxReplicas: 5
    resources:
      averageUtilization: 70

pv:
  capacity:
    storage: 1Gi

pvc:
  resources:
    requests:
      storage: 1Gi

rbac:
  name: secrets-reader