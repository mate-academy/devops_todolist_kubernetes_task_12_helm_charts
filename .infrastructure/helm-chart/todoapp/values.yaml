namespace: todoapp

serviceAccount:
  name: secrets-reader

image:
  repository: tanyasavenko/todoapp
  tag: "4.0.1"

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

affinity:
  key: app
  values:
    - kube2py

secrets:
  data:
    SECRET_KEY: c2VjcmV0
    DB_NAME: dG9kb2Ri
    DB_USER: dXNlcg==
    DB_PASSWORD: cGFzcw==
    DB_HOST: bXlzcWw=

configMap:
  data:
    PYTHONUNBUFFERED: "1"

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

pv:
  capacity: 1Gi

pvc:
  requests:
    storage: 1Gi

service:
  type: ClusterIP
  port: 80

persistence:
  pvcStorage: 1Gi