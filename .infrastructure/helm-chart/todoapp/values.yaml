common:
  namespace: todoapp

image:
  repository: ikulyk404/todoapp
  tag: "4.0.1"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

nodeAffinity:
  key: app
  values:
    - todoapp

serviceAccount:
  name: secrets-reader

secrets:
  SECRET_KEY: "your-django-secret-key"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "1234"
  DB_HOST: "mysql.mysql.svc.cluster.local"
hpa:
  minReplicas: 2
  maxReplicas: 4
  cpu:
    averageUtilization: 70
  memory:
    averageUtilization: 70

storage:
  pv:
    capacity: "2Gi"
  pvc:
    request: "2Gi"