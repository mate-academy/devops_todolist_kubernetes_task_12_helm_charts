
todoapp:
  metadata:
    namespace: todoapp

  secrets:
    SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  update:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  image:
    repository: ikulyk404/todoapp
    version: 4.0.1

  affinity:
    nodeAffinity:
      key: app
      values:
      - todoapp

  scaleReplicas:
    minReplicas: 2
    maxReplicas: 5

  rangeUtilization:
    resource:
      cpu: 70
      memory: 70

  pvcapacity:
    storage: 1Gi

  pvcresources:
    requests:
      storage: 1Gi

  serviceAccount:
    name: secrets-reader