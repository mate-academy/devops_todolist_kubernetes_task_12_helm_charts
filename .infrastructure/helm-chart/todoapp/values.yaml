global:
  namespace: todoapp 
  
image:
  repository: ikulyk404/todoapp
  tag: 4.0.1

serviceAccount:
  name: sa

secrets:
  appSecret:
    SECRET_KEY: '@e2(yy()v& tgh3_s=0yja-i!dpebxx^dg47x)-k&kq_3zf*9e*'
    DB_NAME: app_db
    DB_USER: app_user
    DB_PASSWORD: "app_pass" 
    DB_HOST: "mysql.todoapp.svc.cluster.local"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

affinity:
  key: app
  values:
    - kube2py

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

storage:
  pv:
    capacity: 1Gi
  pvc:
    storageRequest: 500Mi

# ----------------------------------------------------
# Конфігурація для ПІДЧАРТУ MYSQL (Перевизначення)
# ----------------------------------------------------
mysql:
  replicaCount: 1 
  image:
    repository: mysql
    tag: "8.0" 
  database: 
    name: app_db
    user: app_user
  secrets:
    mysqlSecret: 
      MYSQL_ROOT_PASSWORD: "rootpass" 
      MYSQL_USER: "app_user"
      MYSQL_PASSWORD: "app_pass"
      MYSQL_DATABASE: "app_db"
  
  resources: # ДОДАНО: Вимагається для statefulset.yml
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  affinity:
    nodeAffinity:
      key: app
      values:
        - mysql
    tolerations:
      - key: "app"
        operator: "Equal"
        value: "mysql"
        effect: "NoSchedule"
  storage:
    pvc:
      storageRequest: 2Gi