apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.todoapp.names.todoappname }}-ingress
  namespace: {{ .Values.todoapp.namespace.name}}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /(|$)(.*)
        backend:
          service:
            name: {{ .Values.todoapp.names.todoapp_service }}
            port:
              number: 80