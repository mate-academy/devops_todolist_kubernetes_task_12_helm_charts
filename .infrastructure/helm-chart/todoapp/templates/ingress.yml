apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-ingress
  namespace: {{ .Values.todo.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: {{ .Values.todo.ingress.useRegex | quote }}
spec:
  rules:
  - http:
      paths:
      - pathType: ImplementationSpecific
        path: {{ .Values.todo.ingress.path | quote}}
        backend:
          service:
            name: {{ .Chart.Name }}-service
            port:
              number: {{ .Values.todo.service.port }}
