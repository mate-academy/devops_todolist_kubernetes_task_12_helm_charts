apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Chart.Name }}-pv
spec:
  capacity:
    storage: {{ .Values.pv.capacity }}
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  hostPath:
    path: /data/todoapp
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain