apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Chart.Name }}-pv
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.persistence.pv.storageClassName }}
  persistentVolumeReclaimPolicy: Delete
  accessModes:
    {{- range .Values.persistence.pv.accessModes }}
    - {{ . }}
    {{- end }}
  capacity:
    storage: {{ .Values.persistence.pv.capacity }}
  hostPath:
    path: {{ .Values.persistence.pv.hostPath }}
