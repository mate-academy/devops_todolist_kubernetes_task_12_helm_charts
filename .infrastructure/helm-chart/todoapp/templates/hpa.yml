apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{.Chart.Name}}-hpa
  namespace: {{.Values.common.namespace}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{.Chart.Name}}-deployment
  {{- with .Values.todoapp.hpa}}
  minReplicas: {{.replicas.min}}
  maxReplicas: {{.replicas.max}}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{.utilization.cpu}}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{.utilization.memory}}
  {{- end}}