apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.global.namespace }} # ВИПРАВЛЕНО: Використовуємо global
  labels:
    app: {{ .Chart.Name }}
data:
  init.sql: |
    # ВИПРАВЛЕНО: Видалено CREATE USER/PASSWORD з ConfigMap через ризик безпеки.
    CREATE DATABASE IF NOT EXISTS {{ .Values.database.name }};
    GRANT ALL PRIVILEGES ON {{ .Values.database.name }}.* TO '{{ .Values.database.user }}'@'%';
    FLUSH PRIVILEGES;