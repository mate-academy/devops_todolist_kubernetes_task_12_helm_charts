{{- with .Values.todoapp.rbac.account}}
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{$.Chart.Name}}-{{.name}}
  namespace: {{$.Values.common.namespace}}
{{- end}}
---
{{- with .Values.todoapp.rbac.role}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{$.Values.common.namespace}}
  name: {{$.Chart.Name}}-{{.name}}
rules:
- apiGroups: {{.apiGroups | default (list "") | toJson}}
  resources: {{.resources}}
  verbs: ["get", "watch", "list"]
{{- end}}
---
{{- with .Values.todoapp.rbac.roleBinding}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{$.Chart.Name}}-{{.name}}
  namespace: {{$.Values.common.namespace}}
subjects:
- kind: ServiceAccount
  name: {{$.Chart.Name}}-{{$.Values.todoapp.rbac.account.name}}
roleRef:
  kind: Role
  name: {{$.Chart.Name}}-{{$.Values.todoapp.rbac.role.name}}
  apiGroup: rbac.authorization.k8s.io
{{- end}}