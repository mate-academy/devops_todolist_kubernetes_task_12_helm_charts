kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ .Values.todo.rbac.serviceAccountName }}
  namespace: {{ .Values.todo.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.todo.namespace }}
  name: {{ .Values.todo.rbac.serviceAccountName }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-reader-binding
  namespace: {{ .Values.todo.namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.todo.rbac.serviceAccountName }}
roleRef:
  kind: Role
  name: {{ .Values.todo.rbac.serviceAccountName }}
  apiGroup: rbac.authorization.k8s.io
