kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ .Values.rbac.name}}
  namespace: {{ .Values.common.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.common.namespace }}
  name: {{ .Values.rbac.name}}
rules:
- apiGroups: [""]
  resources: {{ .Values.rbac.rules.resources | toJson }}
  verbs: {{ .Values.rbac.rules.verbs | toJson }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rbac.name}}-binding
  namespace: {{ .Values.common.namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.name}}
roleRef:
  kind: Role
  name: {{ .Values.rbac.name}}
  apiGroup: rbac.authorization.k8s.io