apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Chart.Name }}-pv
spec:
  storageClassName: {{ .Values.todo.pv.storageClassName }}
  persistentVolumeReclaimPolicy: Delete
  accessModes:
    - {{ .Values.todo.pv.accessMode }}
  capacity:
    storage: {{ .Values.todo.pv.capacity.storage }}
  hostPath:
    path: {{ .Values.todo.pv.hostPath }}
