apiVersion: v1
kind: ServiceAccount
metadata:
  # ВИПРАВЛЕНО 1: Використовуємо префікс Chart.Name для узгодженості з deployment.yml
  name: {{ .Chart.Name }}-{{ .Values.serviceAccount.name }}

  # ВИПРАВЛЕНО 2: Використовуємо глобальне значення для namespace
  namespace: {{ .Values.global.namespace }}