apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
  # ВИПРАВЛЕНО: Використовуємо коректний namespace батьківського чарту
  namespace: {{ .Values.common.namespace }} 
type: Opaque
data:
  # ВИПРАВЛЕНО: Використовуємо .Values.secrets.appSecret з батьківського values.yaml
  {{- range $key, $value := .Values.secrets.appSecret }}
  {{ $key }}: {{ printf "%v" $value | b64enc | quote }} 
  {{- end }}