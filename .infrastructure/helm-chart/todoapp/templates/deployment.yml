apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge}}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable}}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Values.ServiceAccount.name }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ .Values.image.repo }}:{{ .Values.image.ver }}
        volumeMounts:
        - name: {{ .Chart.Name }}-data
          mountPath: /app/data
        - name: {{ .Chart.Name }}-secrets-volume
          mountPath: "/app/secrets"
          readOnly: true
        - name: {{ .Chart.Name }}-config-volume
          mountPath: "/app/configs"
          readOnly: true
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
        env:
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: {{ .Chart.Name }}-config
              key: PYTHONUNBUFFERED
        {{- range $k, $v := .Values.secrets_map}}
        - name: {{ $k }}
            valueFrom:
              secretKeyRef:
                name: {{ $.Chart.Name }}-secret
                key: {{ $k }}
        {{- end}}
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: {{ .Chart.Name }}-data
        persistentVolumeClaim:
          claimName: pvc-data
      - name: {{ .Chart.Name }}-secrets-volume
        secret:
          secretName: {{ .Chart.Name }}-secret
      - name: {{ .Chart.Name }}-config-volume
        configMap:
          name: {{ .Chart.Name }}-config
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: {{ .Values.nodeAffinity.weight }}
            preference:
              matchExpressions:
              - key: {{ .Values.nodeAffinity.key }}
                operator: {{ .Values.nodeAffinity.operator }}
                values:
                - {{ .Values.nodeAffinity.values }}