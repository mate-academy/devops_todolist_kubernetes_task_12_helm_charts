apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-pvc
  namespace: {{ .Values.namespace }}
spec:
  volumeName: {{ .Chart.Name }}-pv
  accessModes:
{{- range .Values.persistentVolumeClaim.accessModes }}
  - {{ . }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.persistentVolumeClaim.requestStorage }}
