apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-pvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  volumeName: {{ .Chart.Name }}-pv
  storageClassName: {{ .Values.persistence.pv.storageClassName }}
  accessModes:
    {{- range .Values.persistence.pvc.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.pvc.requestsStorage }}
