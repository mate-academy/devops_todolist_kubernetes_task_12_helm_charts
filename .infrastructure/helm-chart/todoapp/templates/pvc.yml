apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-pvc-data
  namespace: {{ include "todoapp.namespace" . }}
spec:
  storageClassName: standard
  volumeName: {{ .Chart.Name }}-pv-data
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.storage.pvc.request | quote }}