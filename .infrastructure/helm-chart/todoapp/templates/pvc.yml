
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pvc-data
  namespace: {{ .Values.common.namespace }}
spec:
  volumeName: {{ .Release.Name }}-pv-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.resources.requests.storage }}