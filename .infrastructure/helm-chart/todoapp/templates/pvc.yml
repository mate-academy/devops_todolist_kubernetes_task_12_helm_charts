
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-pvc-data
  namespace: {{ .Values.todoapp.metadata.namespace }}
spec:
  volumeName: {{ .Chart.Name }}-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.todoapp.pvcresources.requests.storage }}