apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: {{ .Values.pv.storageClassName }}
  volumeName: {{ .Chart.Name }}-pv
  resources:
    requests:
      storage: {{ .Values.pvc.storage }}