apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}
  # КРИТИЧНЕ ВИПРАВЛЕННЯ: ЗАМІНИТИ common на global
  namespace: {{ .Values.global.namespace }} 
  labels:
    app: {{ .Chart.Name }}
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS {{ .Values.database.name }};
    GRANT ALL PRIVILEGES ON {{ .Values.database.name }}.* TO '{{ .Values.database.user }}'@'%';
    FLUSH PRIVILEGES;