apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  # КРИТИЧНЕ ВИПРАВЛЕННЯ: ЗАМІНИТИ common на global
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: {{ .Chart.Name }}
  clusterIP: None # Headless Service для StatefulSet