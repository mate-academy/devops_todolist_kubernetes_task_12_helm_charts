apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.common.namespace }} # ВИПРАВЛЕНО: Видалено .mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: {{ .Chart.Name }}
  clusterIP: None # Headless Service для StatefulSet