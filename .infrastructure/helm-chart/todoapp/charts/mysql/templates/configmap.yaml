apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
data:
  init.sql: |
    GRANT ALL PRIVILEGES ON {{ .Values.database }}.* TO 'app_user'@'%';
    USE {{ .Values.database }};
    CREATE TABLE IF NOT EXISTS counter (
        id INT AUTO_INCREMENT PRIMARY KEY,
        value INT
    );
