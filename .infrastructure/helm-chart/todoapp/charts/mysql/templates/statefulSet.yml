apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Chart.Name}}
  namespace: {{.Values.mysql.global.namespace}}
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: {{.Values.mysql.stateFulSet.replicas}}
  serviceName: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: {{.Values.mysql.stateFulSet.image}}:{{.Values.mysql.stateFulSet.tag}}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{.Chart.Name}}-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{.Chart.Name}}-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{.Chart.Name}}-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: app_db
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql
        - name: config-map
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: {{.Values.mysql.stateFulSet.resources.requests.cpu}}
            memory: {{.Values.mysql.stateFulSet.resources.requests.memory}}
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
      volumes:
      - name: {{.Chart.Name}}-config
        configMap:
          name: mysql
      tolerations:
      - key: {{.Values.mysql.tolerations.key | quote}}
        operator: "Equal"
        value: {{.Values.mysql.tolerations.value | quote}}
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: {{.Values.mysql.affinity.key | quote}}
                    operator: In
                    values:
                    {{- toYaml .Values.mysql.affinity.values | nindent 20 }}
              topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                    - "mysql"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{.Values.mysql.stateFulSet.volumeClaimTemplates.requests.storage}}
