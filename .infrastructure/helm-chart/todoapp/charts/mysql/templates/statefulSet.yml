apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: {{ .Values.replicas }}
  serviceName: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: {{ .Values.image.repo }}:{{ .Values.image.ver}}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Chart.Name }}-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: app_db
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: {{ .Chart.Name }}-data
          mountPath: /var/lib/mysql
          subPath: mysql
        - name: {{ .Chart.Name }}-config-map
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
      volumes:
      - name: {{ .Chart.Name }}-config-map
        configMap:
          name: {{ .Chart.Name }}-config-map
      tolerations:
        - key: {{ .Values.tolerations.key }}
          operator: {{ .Values.tolerations.operator }}
          value: {{ .Values.tolerations.value }}
          effect: {{ .Values.tolerations.effect }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: {{ .Values.affinity.podAntiAffinity.key }}
                    operator: {{ .Values.affinity.podAntiAffinity.operator }}
                    values:
                    - {{ .Values.affinity.podAntiAffinity.values }}
              topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: {{ .Values.affinity.nodeAffinity.key }}
                  operator: {{ .Values.affinity.nodeAffinity.operator }}
                  values:
                    - {{ .Values.affinity.nodeAffinity.values }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.volumeClaimTemplates.storage }}
