apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.mysql.common.namespace }}
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: {{ .Values.mysql.replicas }}
  serviceName: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: {{ .Values.mysql.image.name }}
        image: {{ .Values.mysql.image.image }}:{{ .Values.mysql.image.version }}
        env:
        {{- range $k, $v := .Values.mysql.secrets.data }}
        - name: {{ $k }}
          valueFrom:
            secretKeyRef:
              name: {{ $.Chart.Name }}-secrets
              key: {{ $k }}
        {{- end }}
        - name: MYSQL_DATABASE
          value: app_db
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql
        - name: config-map
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: {{ .Values.mysql.resources.requests.cpu | quote }}
            memory: {{ .Values.mysql.resources.requests.memory | quote }}
          {{- if .Values.mysql.resources.limits }}
          limits:
            cpu: {{ $.Values.mysql.resources.limits.cpu | quote }}
            memory: {{ $.Values.mysql.resources.limits.memory | quote }}
          {{- end }}
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
      volumes:
      - name: config-map
        configMap:
          name: {{ .Chart.Name }}-config
      tolerations:
      {{- range .Values.mysql.tolerations }}
      - key: {{ .key | quote }}
        operator: {{ .operator | quote }}
        value: {{ .value | quote }}
        effect: {{ .effect | quote }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: {{ .Values.mysql.affinity.podAntiAffinity.key | quote }}
                    operator: In
                    values: {{ .Values.mysql.affinity.podAntiAffinity.values }}
              topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.mysql.affinity.nodeAffinity.key }}
                    operator: In
                    values: {{ .Values.mysql.affinity.nodeAffinity.values }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.mysql.pvc.resources.requests.storage }}
