apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.common.namespace }} # ВИПРАВЛЕНО: Видалено .mysql
  labels:
    app: {{ .Chart.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  serviceName: {{ .Chart.Name }}
  replicas: {{ .Values.replicaCount }} # ВИПРАВЛЕНО: Видалено .mysql
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      # ВИПРАВЛЕНО: Додано tolerations та nodeAffinity
      tolerations:
      {{- range .Values.affinity.tolerations }}
        - key: {{ .key }}
          operator: {{ .operator }}
          value: {{ .value }}
          effect: {{ .effect }}
      {{- end }}
      
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.affinity.nodeAffinity.key }}
                    operator: In
                    values:
                      {{- range .Values.affinity.nodeAffinity.values }}
                      - {{ . }}
                      {{- end }}
                      
      containers:
        - name: {{ .Chart.Name }}
          # ВИПРАВЛЕНО: Видалено .mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          
          env:
          {{- range $key, $value := .Values.secrets.mysqlSecret }} # ВИПРАВЛЕНО: Видалено .mysql
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Chart.Name }}-secret
                  key: {{ $key }}
          {{- end }}
          
          ports:
            - containerPort: 3306
              name: mysql
              
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d # Для ініціалізаційних скриптів
              
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }} # ВИПРАВЛЕНО: Видалено .mysql
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
              
      volumes:
        - name: initdb
          configMap:
            name: {{ .Chart.Name }} # Посилання на configmap.yml

  volumeClaimTemplates:
    - metadata:
        name: data
        namespace: {{ .Values.common.namespace }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.pvc.storageRequest }} # ВИПРАВЛЕНО: Видалено .mysql