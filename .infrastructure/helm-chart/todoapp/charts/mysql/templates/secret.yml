# helm-chart/todoapp/charts/mysql/templates/secret.yml
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Chart.Name }}-{{ .Values.namespace }}
type: Opaque
data:
{{- range $key, $value := .Values.mysql.secrets }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
{{- end }}