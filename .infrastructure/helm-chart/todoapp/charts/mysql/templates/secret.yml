apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
  namespace: {{ .Values.common.namespace }} # ВИПРАВЛЕНО: Знову посилаємося на загальний namespace
type: Opaque
data:
{{- range $key, $value := .Values.secrets.mysqlSecret }} # ВИПРАВЛЕНО: Видалено .mysql
  {{ $key }}: {{ printf "%v" $value | b64enc | quote }}
{{- end }}