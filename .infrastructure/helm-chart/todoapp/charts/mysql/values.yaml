common:
  name: mysql
  namespace: mysql

mysql:
  image:
    name: mysql
    repository: mysql
    version: "8.0"

  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"

  replicas: 2

  pvc:
    storage_request: 2Gi

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  affinity:
    antiaffinity:
      key: app
      value: mysql
    nodeaffinity:
      key: app
      value: mysql

  tolerations:
    key: "app"
    value: "mysql"
    effect: "NoSchedule"