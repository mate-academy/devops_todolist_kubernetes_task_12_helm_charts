namespace: todoapp

replicas: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

secrets:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_DATABASE: "tododb"
  MYSQL_USER: "todouser"
  MYSQL_PASSWORD: "todopassword"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

pvcStorage: 2Gi

tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"

affinity: {}
