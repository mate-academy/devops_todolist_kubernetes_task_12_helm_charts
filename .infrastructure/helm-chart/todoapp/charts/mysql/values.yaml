namespace: mysql

replicaCount: 2

image:
  repository: mysql
  tag: "8.0"

storage:
  request: "2Gi"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

tolerations:
  - key: app
    operator: Equal
    value: mysql
    effect: NoSchedule

affinity:
  nodeAffinity:
    key: app
    values:
      - mysql

  podAntiAffinity:
    key: app
    values:
      - mysql

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"