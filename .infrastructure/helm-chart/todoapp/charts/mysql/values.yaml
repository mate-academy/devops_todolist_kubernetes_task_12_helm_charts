namespace: mysql

secretData:
  MYSQL_ROOT_PASSWORD: "MTIzNA=="
  MYSQL_USER: "YXBwX3VzZXI="
  MYSQL_PASSWORD: "MTIzNA=="

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

statefulset:
  replicas: 2

service:
  port: 3306

database:
  name: app_db

storage:
  accessModes:
    - ReadWriteOnce
  requestsStorage: 2Gi

tolerations:
  - key: app
    operator: Equal
    value: mysql
    effect: NoSchedule

affinity:
  node:
    key: app
    values:
      - mysql
  podAntiAffinity:
    enabled: true
    topologyKey: kubernetes.io/hostname

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 1Gi

configMap:
  initSql: |
    GRANT ALL PRIVILEGES ON app_db.* TO 'app_user'@'%';
    USE app_db;
    CREATE TABLE counter (
        id INT AUTO_INCREMENT PRIMARY KEY,
        value INT
    );
