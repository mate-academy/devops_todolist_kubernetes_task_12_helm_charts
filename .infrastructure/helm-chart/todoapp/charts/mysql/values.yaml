mysql:
  common:
    namespace: mysql

  image:
    name: mysql
    image: mysql
    version: 8.0

  secrets:
    data:
      MYSQL_ROOT_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"
      MYSQL_USER: "YXBwX3VzZXI=" # Base64 encoding for "app_user"
      MYSQL_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"

  replicas: 2

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 600m
      memory: 1Gi

  pvc:
    resources:
      requests:
        storage: 2Gi

  tolerations:
    - key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"

  affinity:
    podAntiAffinity:
      key: "app"
      values:
        - mysql
    nodeAffinity:
      key: "app"
      values:
        - mysql
