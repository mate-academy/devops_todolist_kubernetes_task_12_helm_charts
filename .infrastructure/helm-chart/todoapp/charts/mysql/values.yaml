common:
  createNamespace: true
  name: mysql

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

service:
  clusterIP: None
  ports:
    name: mysql
    port: 3306

stetefulSet:
  replicas: 2
  containers:
    name: mysql
    image: mysql
    version: 8.0
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
  tolerations:
    - key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                - mysql
          topologyKey: "kubernetes.io/hostname"
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                    - "mysql"

  vct:
    storage: 2Gi