namespace: mysql

replicas: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

secrets:
  MYSQL_ROOT_PASSWORD: "root_password_dev"
  MYSQL_DATABASE: "todo_db"
  MYSQL_USER: "todo_user"
  MYSQL_PASSWORD: "todo_password_dev"

pvc:
  storage: 1Gi
  storageClassName: standard

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - mysql

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mysql
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: app
    operator: Equal
    value: mysql
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

initSql: |
  -- MySQL database and user are initialized
