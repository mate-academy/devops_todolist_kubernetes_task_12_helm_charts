namespace: mysql

replicaCount: 2

image:
  repository: mysql
  tag: "8.0"

database:
  name: app_db
  user: app_user

secrets:
  mysqlSecret:
    MYSQL_ROOT_PASSWORD: "rootpass"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "app_pass"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 1Gi

storage:
  pvc:
    storageRequest: 2Gi

affinity:
  nodeAffinity:
    key: app
    values:
      - mysql
  tolerations:
    - key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"
