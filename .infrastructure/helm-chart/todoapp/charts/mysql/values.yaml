common:
  namespace: mysql



mysql:
  config:
    data:
      init.sql: |
        GRANT ALL PRIVILEGES ON app_db.* TO 'app_user'@'%';
        USE app_db;
        CREATE TABLE counter (
          id INT AUTO_INCREMENT PRIMARY KEY,
          value INT
        );

  image:
    name: mysql
    repository: mysql
    version: 8.0

  statefulset:
    replicas: 2

  persistence:
    storage: 2Gi

  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 500m

  affinity:
    key: app
    values:
      - mysql

  tolerations:
    key: app
    values:
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"

  secrets:
    MYSQL_ROOT_PASSWORD: MTIzNA== # Base64 encoding for "1234"
    MYSQL_USER: YXBwX3VzZXI= # Base64 encoding for "app_user"
    MYSQL_PASSWORD: MTIzNA== # Base64 encoding for "1234"