namespace:
  name: todoapp

replicaCount: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

secrets:
  MYSQL_ROOT_PASSWORD: "root-password"
  MYSQL_DATABASE: "app_db"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

pvc:
  storage: 1Gi

affinity:
  key: app
  values:
    - mysql
  operator: In

tolerations:
  - key: app
    operator: Equal
    value: mysql
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
