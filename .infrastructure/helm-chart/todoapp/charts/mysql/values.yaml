mysql:
  namespace: mysql
  secrets:
    MYSQL_ROOT_PASSWORD: '1234' # Base64 encoding for "1234"
    MYSQL_USER: app_user # Base64 encoding for "app_user"
    MYSQL_PASSWORD: '1234' # Base64 encoding for "1234"
  replicas: 2
  image:
    name: mysql
    repository: mysql
    tag: 8.0
  tolerations:
    key: "app"
    value: "mysql"
  affinity:
    podAntiAffinity:
      key: "app"
      value: mysql
    nodeAffinity:
      key: "app"
      value: "mysql"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi