# helm-chart/todoapp/charts/mysql/values.yaml
namespace: mysql

mysql:

  image:
    name: mysql
    repository: mysql
    tag: "8.0"

  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"

  statefulSet:
    replicas: 2

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  tolerations:
    key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"

  affinity:
    key: "app"
    operator: "In"
    values:
      - mysql
    topologyKey: "kubernetes.io/hostname"

  storage: 2Gi