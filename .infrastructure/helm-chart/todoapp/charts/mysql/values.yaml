mysql:
  namespace: mysql
  statefulset:
    replicas: 2
  image:
   repository: mysql
   tag: "8.0"
  pvc:
    requests:
      storage: 2Gi
      cpu: 500m
      memory: 1Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        key: app
        operator: In
        values:
          - mysql
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
          key: app
          operator: In
          values:
            - mysql

config:
  MYSQL_ROOT_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"
  MYSQL_USER: "YXBwX3VzZXI=" # Base64 encoding for "app_user"
  MYSQL_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"
  MYSQL_DATABASE: YXBwX2Ri