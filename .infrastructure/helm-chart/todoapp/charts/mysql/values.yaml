mysql:
  namespace: mysql

# Secrets
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"
    MYSQL_DATABASE: "app_db"

# StatefulSet
  replicas: 2

  image:
    repository: mysql
    tag: 8.0

  volumeClaimTemplates:
    name: data
    storage: 1Gi

  tolerations:
    key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"

  affinity:
        podAntiAffinity:
          key: "app"
          operator: In
          values: mysql
          topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          key: "app"
          operator: In
          values: "mysql"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 900m
      memory: 2Gi