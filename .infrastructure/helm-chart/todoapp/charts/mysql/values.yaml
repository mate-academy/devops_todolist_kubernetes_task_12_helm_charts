namespace:
  name: mysql

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

statefulSet:
  replicas: 2
  repository: mysql
  version: 8.0

pvc:
  storage: 2Gi

affinity:
  podAntiAffinity:
    key: app
    values:
    - mysql
  nodeAffinity:
    key: app
    values:
    - mysql

tolerations:
  key: "app"
  operator: "Equal"
  value: "mysql"
  effect: "NoSchedule"


resources:
  requests:
    cpu: 500m
    memory: 1Gi