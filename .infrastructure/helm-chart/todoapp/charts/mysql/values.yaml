common:
  namespace: mysql

mysql:
  image:
    name: mysql
    repository: mysql
    tag: 8.0
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"
  replicas: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  tolerations:
    key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"
  affinity:
    podAntiAffinity:
      key: "app"
      operator: "In"
      values:
        - mysql
      topologyKey: "kubernetes.io/hostname"
    nodeAffinity:
      key: "app"
      operator: "In"
      values:
        - mysql
  volumeClaimTemplates:
    storage: 2Gi