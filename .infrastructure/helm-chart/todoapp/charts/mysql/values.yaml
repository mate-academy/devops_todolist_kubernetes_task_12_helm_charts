# helm-chart/todoapp/charts/mysql/values.yaml
mysql:
  namespace: mysql 
  image:
    name: mysql
    repository: mysql
    version: 8.0

  replicas: 2

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

  configs:
    MYSQL_ROOT_PASSWORD: "mysecretrootpassword" # Розкодоване значення
    MYSQL_USER: "app_user"                     # Розкодоване значення
    MYSQL_PASSWORD: "1234"                     # Розкодоване значення
    MYSQL_DATABASE: "app_db"                   # Додано для повноти, якщо використовується

  affinity:
    enabled: true
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: "app"
                operator: "In"
                values:
                  - "mysql"
          topologyKey: "kubernetes.io/hostname"
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "app"
                operator: "In"
                values:
                  - "mysql"
