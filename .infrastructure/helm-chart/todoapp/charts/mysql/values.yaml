namespace: mysql

replicas: 2

image:
  repository: mysql
  tag: "8.0"

secrets:
  data:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_DATABASE: "app_db"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"

pvc:
  storage: 1Gi

affinity:
  key: app
  values:
    - mysql

tolerations:
  key: app
  operator: Equal
  value: mysql
  effect: NoSchedule

resources:
  requests:
    memory: "512Mi"
    cpu: "150m"
  limits:
    memory: "2Gi"
    cpu: "300m"
