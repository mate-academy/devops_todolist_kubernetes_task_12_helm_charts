namespace: mysql

replicaCount: 2

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  name: mysql
  port: 3306

secrets:
  MYSQL_ROOT_PASSWORD: MTIzNA==
  MYSQL_USER: YXBwX3VzZXI=
  MYSQL_PASSWORD: MTIzNA==

mysqlDatabase: app_db

persistence:
  accessModes:
  - ReadWriteOnce
  requestStorage: 2Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 1Gi

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - mysql
      topologyKey: kubernetes.io/hostname
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: app
          operator: In
          values:
          - mysql

tolerations:
- key: app
  operator: Equal
  value: mysql
  effect: NoSchedule

configMap:
  initSql: |
    GRANT ALL PRIVILEGES ON app_db.* TO 'app_user'@'%';
    USE app_db;
    CREATE TABLE counter (
        id INT AUTO_INCREMENT PRIMARY KEY,
        value INT
    );
