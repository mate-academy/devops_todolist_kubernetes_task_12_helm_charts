common:
  namespace: todoapp

image:
  repository: ikulyk404/todoapp
  tag: 4.0.1

serviceAccount:
  name: todoapp

secrets:
  mysecret:
    SECRET_KEY: '@e2(yy()v& tgh3_s=0yja-i!dpebxx^dg47x)-k&kq_3zf*9e*'
    DB_NAME: app_db
    DB_USER: app_user
    DB_PASSWORD: 1234
    DB_HOST: mysql-0.mysql.mysql.svc.cluster.local

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

affinity:
  key: app
  values:
    - kube2py

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

storage:
  pv:
    capacity: 1Gi
  pvc:
    storageRequest: 500Mi