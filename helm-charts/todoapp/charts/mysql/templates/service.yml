# Headless service for stable DNS entries of StatefulSet members.
apiVersion: v1
kind: Service
metadata:
  name: { {  .Chart.name } }
  namespace: { { .Values.common.namespace } }
spec:
  selector:
    app: { { .Chart.name } }
  ports:
  - name: {{ .Chart.name }}
    port: 3306
  clusterIP: None

