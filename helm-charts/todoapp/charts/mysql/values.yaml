# Namespace configuration
namespace: mysql

# Image configuration
image:
  repository: mysql
  tag: 8.0
  pullPolicy: IfNotPresent

# StatefulSet configuration
statefulset:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Storage configuration
persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 1Gi

# Secrets configuration
secrets:
  - name: mysql-credentials
    data:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "todoapp"
      MYSQL_USER: "todoapp"
      MYSQL_PASSWORD: "todoapp"

# Affinity and Tolerations
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - mysql

tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"
