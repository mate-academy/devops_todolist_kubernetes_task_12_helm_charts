apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: { { .Chart.name } }-ingress
  namespace: { { .Values.common.namespace} }
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /(|$)(.*)
        backend:
          service:
            name: { { .Chart.name } }-service
            port:
              number: 80