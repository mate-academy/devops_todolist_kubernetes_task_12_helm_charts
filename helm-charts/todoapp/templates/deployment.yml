apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.todoapp.names.todoappname }}
  namespace: {{ .Values.todoapp.namespace.name }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.todoapp.rollup.maxSurge }}
      maxUnavailable: {{ .Values.todoapp.rollup.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ .Values.todoapp.names.todoapp-label }}
  template:
    metadata:
      labels:
        app: {{ .Values.todoapp.names.todoapp-label }}
    spec:
      serviceAccountName: {{ .Values.todoapp.rbac.name }}
      containers:
      - name: {{ .Values.todoapp.image.name }}
        image: {{ .Values.todoapp.image.repository }}:{{ .Values.todoapp.image.version }}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: {{ .Values.todoapp.names.app-secret }}-volume
          mountPath: "/app/secrets"
          readOnly: true
        - name: {{ .Values.todoapp.names.app-config }}-volume
          mountPath: "/app/configs"
          readOnly: true
        resources:
          requests:
            memory: {{ .Values.todoapp.resources.requests.memory }}
            cpu:  {{ .Values.todoapp.resources.requests.cpu }}
          limits:
            memory:  {{ .Values.todoapp.resources.limits.memory }}
            cpu:  {{ .Values.todoapp.resources.limits.cpu }}
        env:
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.todoapp.names.app-config }}
              key: PYTHONUNBUFFERED
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.todoapp.names.app-secret }}
              key: SECRET_KEY
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.todoapp.names.app-secret }}
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.todoapp.names.app-secret }}
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.todoapp.names.app-secret }}
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: {{ .Values.todoapp.names.app-secret }}
              key: DB_HOST
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-data
      - name: {{ .Values.todoapp.names.app-secret }}-volume
        secret:
          secretName: {{ .Values.todoapp.names.app-secret }}
      - name: {{ .Values.todoapp.names.app-config }}-volume
        configMap:
          name: {{ .Values.todoapp.names.app-config }}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ .Values.todoapp.names.todoapp-label }}