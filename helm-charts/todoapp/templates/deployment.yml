apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.name}}
  namespace: {{ .Values.common.namespace}}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: { { .Values.todoapp.rollingUpdate.maxSurge} }
      maxUnavailable: { { .Values.todoapp.rollingUpdate.maxUnavailable} }
  selector:
    matchLabels:
      app: {{ .Chart.name}}
  template:
    metadata:
      labels:
        app: {{ .Chart.name}}
    spec:
      serviceAccountName: {{ .Values.todoapp.rbac.serviceAccountName } }
      containers:
      - name: {{ .Chart.name }}
        image: {{ .Values.todoapp.image.repository }}:{{.values.todoapp.image.version}}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: app-secrets-volume
          mountPath: "/app/secrets"
          readOnly: true
        - name: app-config-volume
          mountPath: "/app/configs"
          readOnly: true
        resources:
          requests:
            memory: {{ .Values.todoapp.resources.requests.memory}}
            cpu: {{ .Values.todoapp.resources.requests.cpu}}
          limits:
            memory: {{ .Values.todoapp.resources.limits.memory}}
            cpu: {{ .Values.todoapp.resources.limits.cpu}}
        env:
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PYTHONUNBUFFERED
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: {{ .Values.todoapp.secrets.SECRET_KEY}}
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: {{ .Values.todoapp.secrets.DB_NAME}}
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: {{ .Values.todoapp.secrets.DB_USER}}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: {{ .Values.todoapp.secrets.DB_PASSWORD}}
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: {{ .Values.todoapp.secrets.DB_HOST}}
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-data
      - name: app-secrets-volume
        secret:
          secretName: app-secret
      - name: app-config-volume
        configMap:
          name: app-config
      tolerations:
        - key: { { .Values.todoapp.tolerations.key } }
          operator: "Equal"
          value: { { .Values.todoapp.tolerations.value } }
          effect: { { .Values.todoapp.tolerations.effect } }
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: { { .Values.todoapp.affinity.key } }
                operator: In
                values: { { .Values.todoapp.affinity.values } }