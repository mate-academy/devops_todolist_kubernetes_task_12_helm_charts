apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.todoapp.names.todoappname }}-nodeport
  nnamespace: {{ .Values.todoapp.namespace.name}}
spec:
  type: NodePort
  selector:
    app: {{ .Values.todoapp.names.todoapp-label }}
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30007
