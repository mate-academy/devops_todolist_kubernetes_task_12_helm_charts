apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.todoapp.rbac.name }}
  namespace: todoapp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.todoapp.rbac.name }}-role
  namespace: todoapp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.todoapp.rbac.name }}-binding
  namespace: todoapp
subjects:
- kind: ServiceAccount
  name: {{ .Values.todoapp.rbac.name }}
  namespace: todoapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.todoapp.rbac.name }}-role