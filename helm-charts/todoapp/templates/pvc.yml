
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.todoapp.names.pvc-data }}
  namespace: {{ .Values.todoapp.namespace.name}}
spec:
  volumeName: {{ .Values.todoapp.names.pv-data }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.todoapp.storage.requests.storage }}