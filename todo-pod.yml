apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  labels:
    app: todoapp
spec:
  containers:
  - name: todoapp-container
    image: ikulyk404/todoapp:4.0.1
    ports:
    - containerPort: 8080
    env:
    - name: DB_HOST
      value: "mysql.todoapp.svc.cluster.local"
    - name: DB_NAME
      value: "app_db"
    - name: DB_USER
      value: "app_user"
    - name: DB_PASSWORD
      value: "app_pass"