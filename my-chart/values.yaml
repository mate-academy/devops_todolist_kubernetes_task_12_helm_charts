# Default values for my-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


replicaCount: 1


image:
  repository: yourdockerusername/my-app  # Замініть на ваш Docker образ
  pullPolicy: IfNotPresent
  tag: latest  # Замініть на тег вашого образу, наприклад, 'latest' або інший


imagePullSecrets: []


nameOverride: ""
fullnameOverride: ""


serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""


podAnnotations: {}


podLabels: {}


podSecurityContext: {}


securityContext: {}


service:
  type: ClusterIP
  port: 80
  # Додаємо порт для сервісу, щоб уникнути помилки .Values.service.port


ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths: []
